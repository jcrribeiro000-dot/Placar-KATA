<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Kata - Miyamoto Damashii - v1.2</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-gold: #ffcc00;
            --accent-blue: #45a29e;
            --text-light: #edf5e1;
            --danger-red: #e53935;
            --success-green: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .version-badge {
            font-size: 1rem;
            color: #aaa;
            margin-top: 5px;
            font-weight: bold;
        }

        .category-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .category-container input {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 15px;
            text-align: center;
            background: #0f141c;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 8px;
            width: 400px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            border: 2px solid #3a4750;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--accent-gold);
            border-bottom: 2px solid #3a4750;
            padding-bottom: 10px;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* Form de Entrada */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
            color: #ccc;
            font-weight: bold;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            background: #0f141c;
            border: 1px solid #555;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .judges-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .judge-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .judge-box label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 3px;
        }

        .judge-box input {
            width: 100%;
            padding: 8px 0;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            background: #0f141c;
            border: 1px solid #555;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .preview-sum {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-confirm { background-color: var(--success-green); color: white; }
        .btn-confirm:hover { background-color: #388e3c; }

        .btn-danger { background-color: var(--danger-red); color: white; }
        .btn-danger:hover { background-color: #d32f2f; }

        .btn-warning { background-color: #fbc02d; color: black; }

        /* Tabela do Telão */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.1rem;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #3a4750;
        }

        th {
            background-color: #0f141c;
            color: var(--accent-gold);
            font-size: 1rem;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #171f28;
        }

        /* Pódio e Destaques */
        .rank-1 { background-color: rgba(255, 204, 0, 0.2) !important; font-weight: bold; }
        .rank-2 { background-color: rgba(190, 190, 190, 0.2) !important; font-weight: bold; }
        .rank-3 { background-color: rgba(205, 127, 50, 0.2) !important; font-weight: bold; }

        .badge-podium {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #000;
        }
        .badge-1 { background-color: #ffcc00; }
        .badge-2 { background-color: #e0e0e0; }
        .badge-3 { background-color: #cd7f32; }

        .badge-tie {
            background-color: #e53935;
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Miyamoto Damashii</h1>
        <div class="version-badge">Sistema de Lançamento de Kata - Versão 1.2</div>
        <div class="category-container">
            <input type="text" id="category-title" placeholder="Nome da Categoria (Ex: Kata Masculino Adulto)" value="Kata Oficial - Categoria Geral" onchange="renderTable()">
        </div>
    </header>

    <div class="main-layout">
        <!-- PAINEL DE CONTROLE / ENTRADA DE DADOS -->
        <div class="panel">
            <h2 id="form-title">Lançar Atleta</h2>
            
            <input type="hidden" id="edit-index" value="-1">

            <div class="form-group">
                <label for="athlete-name">Nome do Atleta:</label>
                <input type="text" id="athlete-name" placeholder="Ex: Kenji Sato">
            </div>

            <div class="form-group">
                <label>Notas dos 5 Juízes:</label>
                <div class="judges-grid">
                    <div class="judge-box"><label>J1</label><input type="number" step="0.1" id="j1" oninput="calculatePreview()"></div>
                    <div class="judge-box"><label>J2</label><input type="number" step="0.1" id="j2" oninput="calculatePreview()"></div>
                    <div class="judge-box"><label>J3</label><input type="number" step="0.1" id="j3" oninput="calculatePreview()"></div>
                    <div class="judge-box"><label>J4</label><input type="number" step="0.1" id="j4" oninput="calculatePreview()"></div>
                    <div class="judge-box"><label>J5</label><input type="number" step="0.1" id="j5" oninput="calculatePreview()"></div>
                </div>
            </div>

            <div class="preview-sum">
                Somatória: <span id="preview-total" style="color: var(--accent-gold);">0.0</span>
            </div>

            <button class="btn-action btn-confirm" id="btn-save" onclick="saveAthlete()">Confirmar e Salvar</button>
            <button class="btn-action btn-warning" id="btn-cancel" onclick="clearForm()" style="display:none;">Cancelar Edição</button>
            
            <hr style="border-color: #3a4750; margin: 20px 0;">

            <button class="btn-action btn-danger" onclick="resetAll()">Resetar Toda a Categoria</button>
        </div>

        <!-- PAINEL DO TELÃO / CLASSIFICAÇÃO -->
        <div class="panel">
            <h2>Classificação Geral - Telão</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Atleta</th>
                            <th>J1</th>
                            <th>J2</th>
                            <th>J3</th>
                            <th>J4</th>
                            <th>J5</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="athletes-table-body">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Estado da Aplicação - Versão 1.2
        let athletes = JSON.parse(localStorage.getItem('kata_athletes_v1.2')) || [];

        function saveToStorage() {
            localStorage.setItem('kata_athletes_v1.2', JSON.stringify(athletes));
        }

        function calculatePreview() {
            let total = 0;
            for (let i = 1; i <= 5; i++) {
                const val = parseFloat(document.getElementById(`j${i}`).value) || 0;
                total += val;
            }
            document.getElementById('preview-total').innerText = total.toFixed(1);
        }

        function saveAthlete() {
            const name = document.getElementById('athlete-name').value.trim();
            const editIndex = parseInt(document.getElementById('edit-index').value);

            if (!name) {
                alert("Por favor, digite o nome do atleta.");
                return;
            }

            const scores = [];
            for (let i = 1; i <= 5; i++) {
                const score = parseFloat(document.getElementById(`j${i}`).value) || 0;
                scores.push(score);
            }

            const total = scores.reduce((a, b) => a + b, 0);

            const athleteData = {
                name: name,
                scores: scores,
                total: parseFloat(total.toFixed(2))
            };

            if (editIndex === -1) {
                athletes.push(athleteData);
            } else {
                athletes[editIndex] = athleteData;
            }

            saveToStorage();
            clearForm();
            renderTable();
        }

        function clearForm() {
            document.getElementById('athlete-name').value = '';
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`j${i}`).value = '';
            }
            document.getElementById('edit-index').value = '-1';
            document.getElementById('preview-total').innerText = '0.0';
            document.getElementById('form-title').innerText = 'Lançar Atleta';
            document.getElementById('btn-save').innerText = 'Confirmar e Salvar';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        function editAthlete(index) {
            const athlete = athletes[index];
            document.getElementById('athlete-name').value = athlete.name;
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`j${i}`).value = athlete.scores[i - 1];
            }
            document.getElementById('edit-index').value = index;
            document.getElementById('form-title').innerText = 'Editar Atleta';
            document.getElementById('btn-save').innerText = 'Salvar Alterações';
            document.getElementById('btn-cancel').style.display = 'block';
            calculatePreview();
        }

        function deleteAthlete(index) {
            if (confirm(`Deseja remover ${athletes[index].name}?`)) {
                athletes.splice(index, 1);
                saveToStorage();
                renderTable();
            }
        }

        function resetAll() {
            if (confirm("ATENÇÃO: Deseja apagar TODOS os atletas e reiniciar a categoria?")) {
                athletes = [];
                saveToStorage();
                clearForm();
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('athletes-table-body');
            tbody.innerHTML = '';

            if (athletes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="color: #888;">Nenhum atleta cadastrado até o momento.</td></tr>`;
                return;
            }

            // Ordena atletas pela somatória (Maior para menor)
            let sorted = athletes.map((a, idx) => ({ ...a, originalIndex: idx }));
            sorted.sort((a, b) => b.total - a.total);

            // Mapeia os totais para verificar empates
            const totalCounts = {};
            sorted.forEach(a => {
                totalCounts[a.total] = (totalCounts[a.total] || 0) + 1;
            });

            sorted.forEach((athlete, rankIndex) => {
                const tr = document.createElement('tr');
                
                const rank = rankIndex + 1;
                let rankBadge = `${rank}º`;
                let rowClass = '';

                if (rank === 1) {
                    rowClass = 'rank-1';
                    rankBadge = `<span class="badge-podium badge-1">1º LUGAR</span>`;
                } else if (rank === 2) {
                    rowClass = 'rank-2';
                    rankBadge = `<span class="badge-podium badge-2">2º LUGAR</span>`;
                } else if (rank === 3) {
                    rowClass = 'rank-3';
                    rankBadge = `<span class="badge-podium badge-3">3º LUGAR</span>`;
                }

                if (rowClass) tr.className = rowClass;

                // Alerta de Empate
                let tieAlert = '';
                if (rank <= 3 && totalCounts[athlete.total] > 1) {
                    tieAlert = `<span class="badge-tie">DESEMPATE NECESSÁRIO</span>`;
                }

                tr.innerHTML = `
                    <td>${rankBadge}</td>
                    <td style="font-weight: bold; text-align: left; font-size: 1.2rem;">${athlete.name} ${tieAlert}</td>
                    <td>${athlete.scores[0]}</td>
                    <td>${athlete.scores[1]}</td>
                    <td>${athlete.scores[2]}</td>
                    <td>${athlete.scores[3]}</td>
                    <td>${athlete.scores[4]}</td>
                    <td style="font-size: 1.3rem; font-weight: 900; color: var(--accent-gold);">${athlete.total.toFixed(1)}</td>
                    <td>
                        <button class="btn-sm btn-warning" onclick="editAthlete(${athlete.originalIndex})">Editar</button>
                        <button class="btn-sm btn-danger" onclick="deleteAthlete(${athlete.originalIndex})">Excluir</button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        // Inicialização
        renderTable();
    </script>
</body>
</html>
